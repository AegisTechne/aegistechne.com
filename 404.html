<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<title>Page not found | Aegis Techne</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#F7F9FC;--text:#0B1F3A;--muted:#4A5B73;--blue:#1D4ED8;--blue-hover:#1E40AF}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1.25rem;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:1.0625rem;line-height:1.6}
main{max-width:30rem}
img{width:48px;height:48px}
h1{font-size:clamp(1.8rem,6vw,2.5rem);line-height:1.2;margin:1rem 0 .75rem}
p{color:var(--muted);margin:0 0 1.5rem}
a{display:inline-block;background:var(--blue);color:#fff;text-decoration:none;font-weight:600;padding:.7rem 1.25rem;border-radius:8px}
a:hover{background:var(--blue-hover)}
a:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="/logo.svg" alt="Aegis Techne logo" width="48" height="48">
  <h1>Page not found.</h1>
  <p>That page doesn't exist.</p>
  <a href="/">Back to home</a>
</main>
</body>
</html>
